name: Publish Packages

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      SRC_DIR: ./src
      NUPKGS_DIR: ${{ github.workspace }}/src/nupkgs

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup .NET Environment
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          7.0.x
          9.0.x
          10.0.x

    - name: Restore
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet restore

    - name: Build
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test ./test/Sufficit.Gateway.Zabbix.Tests.csproj --configuration Release

    - name: Pack
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet pack --configuration Release --no-build --output ${{ env.NUPKGS_DIR }}

    - name: Publish to NuGet.org
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
